<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#e7f6ff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="元素大挑戰">
    <title>化學見習生：元素大挑戰</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #16324a;
            --muted: #4d6478;
            --line: #16324a;
            --paper: #fffdf8;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; }
        body {
            overflow: hidden;
            color: var(--ink);
            font-family: "Noto Sans TC", "PingFang HK", "Microsoft JhengHei", "Heiti TC", sans-serif;
            background:
                radial-gradient(circle at 8% 0%, rgba(255, 214, 102, .5), transparent 28%),
                radial-gradient(circle at 100% 8%, rgba(125, 211, 252, .55), transparent 26%),
                linear-gradient(180deg, #e7f6ff 0%, #fff8ef 100%);
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }
        button, input { font: inherit; color: inherit; }
        button {
            background: #fff;
            border: 3px solid var(--line);
            border-radius: 16px;
            font-weight: 800;
            cursor: pointer;
        }
        button:disabled { opacity: .45; cursor: default; }
        button:focus-visible, a:focus-visible { outline: 3px solid #0f6e86; outline-offset: 2px; }
        #app {
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #hud {
            width: min(520px, 100%);
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
        }
        #back-btn, #sound-btn, #points-btn, #player-btn {
            border-radius: 999px;
            box-shadow: 0 3px 0 var(--line);
            background: #fff;
            min-width: 44px;
            min-height: 40px;
            padding: 6px 10px;
            font-weight: 900;
        }
        #player-btn {
            flex: 1;
            min-width: 0;
            text-align: left;
            background: transparent;
            border-color: transparent;
            box-shadow: none;
            padding-left: 2px;
        }
        #player-btn b, #player-btn small { display: block; }
        #player-btn b { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #player-btn small { color: var(--muted); font-size: 12px; }
        #view {
            width: min(520px, 100%);
            margin: 0 auto;
            flex: 1;
            min-height: 0;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
        }
        #view.play { overflow: hidden; }
        .wrap, .panel, .playcol { padding: 6px 14px calc(16px + env(safe-area-inset-bottom)); }
        .wrap, .panel { display: flex; flex-direction: column; gap: 12px; }
        .playcol { min-height: 100%; display: flex; flex-direction: column; gap: 8px; }
        .playcol.fit { height: 100%; }
        .cardbox {
            background: var(--paper);
            border: 3px solid var(--line);
            border-radius: 22px;
            padding: 12px;
            box-shadow: 0 6px 0 rgba(22, 50, 74, .08);
        }
        .kicker { margin: 0 0 4px; font-weight: 900; color: #0f6e86; font-size: 13px; letter-spacing: .04em; }
        h2 { margin: 0 0 8px; font-size: 24px; line-height: 1.3; }
        .how { margin: 0; font-weight: 700; color: var(--muted); line-height: 1.45; }
        .tip { font-size: 22px; line-height: 1.35; }
        .primary, .ghost {
            width: 100%;
            padding: 13px 12px;
            font-size: 17px;
            box-shadow: 0 4px 0 var(--line);
        }
        .primary { background: #0f6e86; color: #fff; }
        .ghost { background: #fff; }
        .primary:active, .ghost:active, .mode:active, .bin:active, .tiny:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 var(--line);
        }
        .actions { display: flex; flex-direction: column; gap: 10px; }
        .check { display: flex; gap: 10px; align-items: center; font-weight: 800; }
        .check input { width: 22px; height: 22px; }
        .hero { display: flex; gap: 12px; align-items: center; }
        .person { width: 74px; flex: none; }
        .head {
            width: 48px; height: 48px; margin: 0 auto; border-radius: 50%;
            background: #ffd7b5; border: 3px solid var(--line); position: relative; z-index: 1;
        }
        .head::before, .head::after {
            content: ""; position: absolute; top: 18px; width: 5px; height: 5px;
            background: var(--ink); border-radius: 50%;
        }
        .head::before { left: 12px; }
        .head::after { right: 12px; }
        .goggles {
            position: absolute; left: 4px; right: 4px; top: 14px; height: 14px;
            border: 3px solid var(--line); border-radius: 8px; background: rgba(125, 211, 252, .65);
        }
        .coat {
            width: 64px; height: 46px; margin: -6px auto 0; border-radius: 12px 12px 16px 16px;
            border: 3px solid var(--line); background: var(--coat, #f7fbff); position: relative;
        }
        .pocket {
            width: 16px; height: 12px; border: 2px solid var(--line); border-radius: 4px;
            position: absolute; right: 8px; top: 14px;
        }
        .glove {
            position: absolute; bottom: -6px; width: 14px; height: 14px; border-radius: 50%;
            background: #b7f0c4; border: 3px solid var(--line);
        }
        .glove.l { left: -8px; }
        .glove.r { right: -8px; }
        .hero-copy b { display: block; font-size: 18px; }
        .hero-copy span, .hero-copy small { display: block; font-weight: 800; color: var(--muted); }
        .shelf { display: flex; gap: 6px; margin-top: 8px; }
        .shelf i {
            width: 40px; height: 40px; display: grid; place-items: center; font-style: normal;
            border-radius: 12px; border: 2px solid var(--line); background: #fff; font-size: 18px;
        }
        .shelf i.off { filter: grayscale(1); opacity: .4; }
        .bar, .timebar {
            height: 12px; border-radius: 999px; background: #e7eef3;
            border: 2px solid var(--line); overflow: hidden;
        }
        .bar > span, .timebar > span { display: block; height: 100%; width: 0; background: #22c55e; }
        .mode {
            width: 100%;
            display: flex;
            gap: 10px;
            align-items: center;
            text-align: left;
            padding: 12px;
            border-radius: 20px;
            box-shadow: 0 5px 0 var(--line);
        }
        .mode .ico { font-size: 30px; width: 42px; text-align: center; flex: none; }
        .mode b { display: block; font-size: 18px; }
        .mode small { color: var(--muted); font-weight: 800; }
        .grid5 {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }
        .cell {
            position: relative;
            min-height: 52px;
            border-radius: 14px;
            padding: 4px 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .cell small { font-size: 10px; font-weight: 800; color: var(--muted); }
        .cell .sym { font-size: 18px; }
        .cell.none { background: #f4f7fa; }
        .cell.low { background: #ffd5d5; }
        .cell.mid { background: #fff1b8; }
        .cell.good { background: #c9f5d6; }
        .cell.star::after {
            content: "★";
            position: absolute;
            top: 1px; right: 4px;
            font-size: 9px;
            color: #d97706;
        }
        .legend { display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: 12px; font-weight: 800; color: var(--muted); }
        .legend b { display: inline-block; width: 12px; height: 12px; border-radius: 4px; border: 2px solid var(--line); vertical-align: -2px; }
        .sym { font-family: Nunito, "Segoe UI", sans-serif; font-weight: 900; letter-spacing: -0.03em; line-height: 1; }
        .links { display: flex; gap: 8px; }
        .links button { flex: 1; padding: 10px 8px; box-shadow: 0 3px 0 #d5e0e8; }
        .footnote { margin: 0; font-size: 12px; font-weight: 700; color: var(--muted); line-height: 1.45; }
        .gamebar { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-weight: 900; font-size: 14px; }
        .tiny { padding: 6px 10px; border-radius: 999px; box-shadow: 0 3px 0 var(--line); }
        .feedback {
            min-height: 46px;
            background: #fff;
            border: 3px solid var(--line);
            border-radius: 14px;
            padding: 8px 10px;
            font-weight: 800;
            font-size: 15px;
            line-height: 1.35;
        }
        .arena {
            flex: 1;
            min-height: 160px;
            position: relative;
            overflow: hidden;
            border-radius: 22px;
            border: 3px solid var(--line);
            background:
                radial-gradient(circle at 18% 12%, rgba(255,255,255,.85), transparent 28%),
                linear-gradient(#dff4ff, #fff6ea);
            touch-action: none;
        }
        .arena.lab {
            background: #9fd0de url("assets/catcher/lab-bg.jpg") center bottom / cover no-repeat;
        }
        .arena.lab::after { content: none; }
        .catcher {
            position: absolute;
            left: 0;
            bottom: 0;
            width: min(52%, 230px);
            z-index: 4;
            touch-action: none;
            pointer-events: none;
        }
        .catcher .sprite { position: relative; }
        .catcher.ready .sprite { animation: bob 1.5s ease-in-out infinite; }
        .catcher img {
            width: 100%;
            height: auto;
            display: block;
        }
        .catcher.correct img { filter: drop-shadow(0 0 16px #d7fbff) brightness(1.18); }
        .catcher.burnt img { filter: drop-shadow(0 0 14px #ffb15a); }
        .caught {
            position: absolute;
            left: 14%;
            top: 53.5%;
            width: 28%;
            height: 22%;
            display: grid;
            place-items: center;
            border-radius: 16%;
            background: #17243f;
            color: #e7fbff;
            border: 3px solid #9ad4ea;
            font-family: "Noto Sans TC", "PingFang HK", "Microsoft JhengHei", sans-serif;
            font-weight: 900;
            font-size: 13cqw;
            line-height: 1;
            letter-spacing: 0;
            box-shadow: 0 0 10px #7ee7ff, inset 0 0 10px rgba(130, 220, 255, .4);
            z-index: 6;
        }
        .catcher { container-type: inline-size; }
        .caught.long { font-size: 8.4cqw; }
        .catcher.correct .caught {
            left: 14%;
            top: 64%;
            width: 34%;
            height: 22%;
            background: #f4fdff;
            color: #16324a;
            border-color: #ffffff;
            box-shadow: 0 0 16px #ffffff;
        }
        .catcher.burnt .caught { visibility: hidden; }
        .caught:empty { display: none; }
        .aim {
            position: absolute;
            left: 25%;
            top: 11%;
            width: 52px;
            height: 46px;
            margin: -64px 0 0 -26px;
            z-index: 7;
            pointer-events: none;
        }
        .aim::before {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            border-left: 16px solid transparent;
            border-right: 16px solid transparent;
            border-top: 30px solid #ffe14a;
            filter: drop-shadow(0 0 4px #fff) drop-shadow(0 0 12px #7ee7ff);
            animation: aimglow .9s ease-in-out infinite;
        }
        .catcher.correct .aim, .catcher.burnt .aim { display: none; }
        .bubble {
            position: absolute;
            width: 54px;
            height: 54px;
            margin: -27px 0 0 -27px;
            border-radius: 50%;
            border: 3px solid #16324a;
            display: grid;
            place-items: center;
            font-family: Nunito, sans-serif;
            font-weight: 900;
            font-size: 20px;
            color: #16324a;
            z-index: 2;
            box-shadow: inset 0 -6px 0 rgba(22, 50, 74, .12), 0 4px 0 rgba(22, 50, 74, .18);
        }
        .bubble.long { font-size: 16px; }
        .bubble.hinted { outline: 4px solid #fff; }
        .shine {
            position: absolute;
            left: 0;
            top: 6%;
            width: 68%;
            height: 82%;
            z-index: 5;
            pointer-events: none;
            background: radial-gradient(circle at 46% 38%, rgba(255,255,255,.96), rgba(150,240,255,.78) 26%, rgba(70,200,255,.35) 48%, transparent 68%);
            mix-blend-mode: screen;
            animation: flare .4s ease-out;
        }
        .hero-cat { width: 104px; height: auto; flex: none; }
        .arena::after {
            content: "";
            position: absolute;
            left: 10px; right: 10px; bottom: 8px;
            height: 10px;
            border-radius: 8px;
            background: #e7c99a;
            border: 3px solid var(--line);
            z-index: 1;
        }
        .bottle { position: absolute; left: 0; top: 0; width: 118px; z-index: 2; touch-action: none; }
        .fuse { height: 8px; border-radius: 99px; background: #e5eef3; border: 2px solid var(--line); overflow: hidden; margin-bottom: 4px; }
        .fuse > span { display: block; height: 100%; width: 100%; background: #22c55e; }
        .glass {
            height: 120px;
            border-radius: 18px 18px 26px 26px;
            border: 3px solid var(--line);
            background: rgba(255,255,255,.78);
            position: relative;
            overflow: hidden;
        }
        .liquid { position: absolute; left: 0; right: 0; bottom: 0; height: 42%; }
        .tag {
            position: relative;
            z-index: 1;
            margin: 16px 8px 0;
            background: #fff;
            border: 2px solid var(--line);
            border-radius: 12px;
            text-align: center;
            padding: 2px 4px 4px;
        }
        .tag b { display: block; font-size: 36px; line-height: 1.1; }
        .tag small { font-weight: 800; color: var(--muted); font-size: 11px; }
        .bottle.shatter .glass { animation: crack .35s linear; }
        .bins { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .bin {
            min-height: 74px;
            background: var(--bin);
            border-radius: 18px;
            box-shadow: 0 5px 0 var(--line);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            touch-action: manipulation;
        }
        .bin .sym { font-size: 30px; }
        .bin .sym.long { font-size: 24px; }
        .bin.good { outline: 4px solid #16a34a; }
        .bin.bad { outline: 4px solid #dc2626; }
        .bin.hint { animation: pulse .7s ease infinite; }
        .keycap { display: none; position: absolute; top: 4px; left: 6px; font-size: 11px; font-weight: 900; }
        .kbhint { display: none; margin: 0; text-align: center; font-size: 12px; font-weight: 800; color: var(--muted); }
        .boom {
            position: absolute;
            left: 4%;
            top: 2%;
            width: 58%;
            height: 42%;
            z-index: 6;
            display: grid;
            place-items: center;
            font-size: 64px;
            pointer-events: none;
            animation: flare .35s ease-out;
        }
        .board { position: relative; flex: 1; min-height: 240px; touch-action: none; }
        .board svg { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: visible; }
        .key {
            position: absolute;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 0 var(--line);
            z-index: 1;
            background: #fff;
            line-height: 1;
        }
        .key .sym { font-size: 22px; }
        .key small { font-size: 10px; font-weight: 800; }
        .key.on { background: #16324a; color: #fff; }
        .key.badflash { background: #fecaca; }
        .key.hint { outline: 4px solid #f0b429; }
        .director { display: flex; gap: 8px; align-items: flex-start; }
        .avatar {
            flex: none; width: 42px; height: 42px; display: grid; place-items: center;
            border-radius: 14px; border: 3px solid var(--line); background: #fff; font-size: 22px;
        }
        .director p { margin: 0; font-weight: 800; line-height: 1.4; }
        .dish {
            min-height: 92px;
            border-radius: 46px;
            border: 4px solid #8fd0c4;
            background: radial-gradient(circle at 50% 35%, #f8fffd, #d7f5ee 70%);
            box-shadow: inset 0 -8px 0 rgba(22, 50, 74, .05);
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-content: center;
            justify-content: center;
            padding: 12px 16px;
        }
        .dish-empty { font-weight: 800; color: #5d8f86; }
        .chip { padding: 6px 10px; border-radius: 999px; background: #16324a; color: #fff; }
        .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .tile { min-height: 58px; font-size: 22px; border-radius: 16px; box-shadow: 0 4px 0 var(--line); }
        .tile.on { background: #16324a; color: #fff; }
        .cardface {
            width: 100%;
            min-height: 230px;
            border-radius: 28px;
            border: 4px solid var(--line);
            background: #fff;
            box-shadow: 0 8px 0 #9fd6ee;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .cardface strong {
            font-size: 72px;
            line-height: 1;
            font-family: Nunito, "Noto Sans TC", "PingFang HK", "Microsoft JhengHei", sans-serif;
        }
        .cardface em { font-style: normal; font-weight: 800; color: var(--muted); }
        .cardface.back { background: #16324a; color: #fff; box-shadow: 0 8px 0 #0f6e86; }
        .cardface.back em { color: #d5e7ef; }
        .row2 { display: flex; gap: 8px; }
        .row2 button { flex: 1; padding: 12px 8px; box-shadow: 0 4px 0 var(--line); }
        .tabs { display: flex; gap: 8px; }
        .tabs button { flex: 1; padding: 8px; box-shadow: none; }
        .tabs button.on { background: #16324a; color: #fff; }
        .sheet-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: 14px;
            background: #fff;
            margin-bottom: 8px;
        }
        .sheet-row b { font-family: Nunito, sans-serif; font-size: 22px; }
        .player {
            width: 100%;
            text-align: left;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 0 #d5e0e8;
        }
        .player.on { background: #e5f6ff; }
        .danger { background: #fff1f1; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            border: 3px solid var(--line);
            background: #fff;
            font-weight: 800;
        }
        .stars { font-size: 28px; letter-spacing: 4px; margin: 0; }
        .bigsym { font-family: Nunito, sans-serif; font-size: 64px; text-align: center; margin: 0; }
        #toast[hidden], #modal[hidden], #ghost[hidden] { display: none !important; }
        #toast {
            position: fixed;
            z-index: 40;
            left: 50%;
            top: calc(12px + env(safe-area-inset-top));
            transform: translateX(-50%);
            width: min(420px, calc(100% - 24px));
            background: #16324a;
            color: #fff;
            border-radius: 16px;
            padding: 12px 14px;
            font-weight: 800;
            line-height: 1.4;
            text-align: center;
        }
        #modal {
            position: fixed;
            inset: 0;
            z-index: 30;
            background: rgba(22, 50, 74, .45);
            display: grid;
            place-items: center;
            padding: 18px;
        }
        .sheet {
            width: min(440px, 100%);
            max-height: min(86dvh, 720px);
            overflow: auto;
            background: var(--paper);
            border: 4px solid var(--line);
            border-radius: 28px;
            padding: 18px;
            box-shadow: 0 12px 0 rgba(22, 50, 74, .15);
        }
        .sheet .ghost, .sheet .primary { margin-top: 8px; }
        #ghost {
            position: fixed;
            z-index: 25;
            transform: translate(-50%, -50%);
            min-width: 64px;
            height: 64px;
            padding: 0 10px;
            display: grid;
            place-items: center;
            background: #16324a;
            color: #fff;
            border-radius: 16px;
            font-family: Nunito, sans-serif;
            font-weight: 900;
            font-size: 24px;
            pointer-events: none;
        }
        .shop-item { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
        .shop-item .ico {
            width: 48px; height: 48px; flex: none; display: grid; place-items: center;
            border-radius: 14px; border: 3px solid var(--line); background: #fff; font-size: 24px;
        }
        .shop-item p { margin: 2px 0 0; color: var(--muted); font-weight: 700; font-size: 13px; }
        .shop-item button { margin-left: auto; padding: 8px 10px; white-space: nowrap; }
        @keyframes pulse { 50% { transform: translateY(-4px); } }
        @keyframes bob { 50% { transform: translateY(-5px); } }
        @keyframes aimglow { 50% { opacity: .45; filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 12px #fff6a0); } }
        @keyframes flare { from { opacity: 0; transform: scale(.72); } to { opacity: 1; transform: scale(1); } }
        @keyframes crack {
            40% { transform: rotate(8deg) scale(.92); }
            100% { transform: rotate(-6deg) scale(.8); opacity: .35; }
        }
        @keyframes shake {
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
        .shake { animation: shake .35s linear; }
        @media (hover: hover) and (pointer: fine) {
            .kbhint, .keycap { display: block; }
        }
        @media (max-height: 520px) {
            .bin { min-height: 58px; }
            .bin .sym { font-size: 24px; }
            .glass { height: 100px; }
            .tag b { font-size: 30px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <div id="app">

function shuffle(list) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function load() {

function recentAcc(p) {
    const h = p.history || [];
    if (!h.length) return 0;
    return h.reduce((sum, n) => sum + n, 0) / h.length;
}
function masteredCount(p) {
    return ELEMENTS.filter((e) => {
        const s = p.perElement[e.z];
        if (!s) return false;
        const n = s.ok + s.bad;
        return n >= 2 && s.ok / n >= 0.95;
    }).length;
}
function qualify(p) {
    const acc = recentAcc(p);
    const n = (p.history || []).length;
    const m = masteredCount(p);
    let best = RANKS[0];
    RANKS.slice(1).forEach((cand) => {
        if (p.earned < cand.earned || acc < cand.acc || n < cand.n) return;
        if ((cand.mastered || 0) > m) return;
        best = cand;
    });
    return best;
}
function syncRank() {
    const p = profile();
    const order = RANKS.map((r) => r.id);
    const q = qualify(p);
    if (order.indexOf(q.id) > order.indexOf(p.highestRank || "trainee")) p.highestRank = q.id;
    return RANKS.find((r) => r.id === (p.highestRank || "trainee"));
}
function nextNeed(p) {

        `最近正確率 ${Math.round(nxt.acc * 100)}%（現在 ${Math.round(recentAcc(p) * 100)}%）`,
        `至少作答 ${nxt.n} 題（現在 ${(p.history || []).length}）`
    ];
    if (nxt.mastered) bits.push(`熟練 ${nxt.mastered}/20（現在 ${masteredCount(p)}）`);

}

function remember(z, ok) {
    const p = profile();
    freshDaily(p);
    const stat = p.perElement[z] || (p.perElement[z] = { ok: 0, bad: 0 });
    p.attempts++;
    p.history = p.history || [];
    p.history.push(ok ? 1 : 0);
    if (p.history.length > 60) p.history.shift();
    if (ok) {
        p.correct++;
        stat.ok++;
        p.daily.n++;
        p.streak++;
        if (p.streak > p.bestStreak) p.bestStreak = p.streak;

function elementBySym(sym) { return ELEMENTS.find((e) => e.sym === sym); }
function explainMiss(el, picked) {
    const head = el.reactive ? `${el.zh}是活潑金屬，標錯很危險。` : "";
    if (!picked) return `${head || "太慢了，瓶子跌碎。"}${el.zh}的符號是 ${el.sym}。`;
    if (FAKES[picked]) return `${picked}是${FAKES[picked]}，不在前 20 個。${head}${el.zh}的符號是 ${el.sym}。`;
    const other = elementBySym(picked);
    if (other) return `${head}這瓶是${el.zh}，符號是 ${el.sym}。${picked} 是${other.zh}。`;
    return `${head}${el.zh}的符號是 ${el.sym}。`;
}
function wrongLine(w) {

    if (FAKES[w.picked]) return `${w.zh} → ${w.sym}（${w.picked} 是${FAKES[w.picked]}）`;
    const other = elementBySym(w.picked);
    return other ? `${w.zh} → ${w.sym}（不是 ${w.picked} ${other.zh}）` : `${w.name || w.zh} → ${w.formula || w.sym}`;
}

function unlockAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;

function tone(freq, dur, type, vol) {
    if (!root.sound || !audioCtx) return;
    try {
        const t = audioCtx.currentTime;
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = type || "sine";
        o.frequency.setValueAtTime(freq, t);
        g.gain.setValueAtTime(vol || 0.05, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start(t);
        o.stop(t + dur);
    } catch (e) { /* ignore audio errors */ }
}

function toast(msg, ms) {

function pumpToast() {
    if (toastOn || !toastQueue.length) return;
    toastOn = true;
    const item = toastQueue.shift();
    const t = $("toast");
    t.textContent = item.msg;
    t.hidden = false;
    setTimeout(() => {
        t.hidden = true;
        toastOn = false;
        pumpToast();
    }, item.ms);
}

function makeBins(el, stage) {
    const picks = [];
    const early = stage <= 2;
    const allowFake = stage > 5;
    shuffle(CONF[el.sym] || []).forEach((sym) => {
        if (picks.length >= 3 || sym === el.sym || picks.includes(sym)) return;
        const real = elementBySym(sym);
        if (early && (!real || real.z > 10)) return;
        if (!allowFake && !real) return;
        if (!real && !FAKES[sym]) return;
        picks.push(sym);
    });
    shuffle(ELEMENTS.filter((e) => e.sym !== el.sym && !picks.includes(e.sym) && (stage > 5 || e.z <= 10))).forEach((e) => {
        if (picks.length < 3) picks.push(e.sym);
    });
    return shuffle([el.sym, ...picks.slice(0, 3)]);
}
function pickWeak(pool) {
    const p = profile();
    const bag = [];
    pool.forEach((e) => {
        const s = p.perElement[e.z];
        const seen = s ? s.ok + s.bad : 0;
        const acc = seen ? s.ok / seen : 0;
        const w = seen === 0 ? 4 : 1 + Math.round((1 - acc) * 5);
        for (let i = 0; i < w; i++) bag.push(e);
    });
    return bag[Math.floor(Math.random() * bag.length)];
}
function buildQueue(stage, slow) {
    const pool = stage <= 5 ? ELEMENTS.filter((e) => e.z <= 10) : ELEMENTS;
    const late = pool.filter((e) => e.z > 10);
    const count = stage === 1 ? 6 : stage < 6 ? 8 : 10;
    const q = [];
    for (let i = 0; i < count; i++) {
        let pick;
        if (slow) pick = pickWeak(pool);
        else if (stage > 5 && late.length && Math.random() < 0.7) pick = late[Math.floor(Math.random() * late.length)];
        else pick = pool[Math.floor(Math.random() * pool.length)];
        if (q.length >= 2 && q[q.length - 1].z === pick.z && q[q.length - 2].z === pick.z) {
            pick = pool[(pool.indexOf(pick) + 1) % pool.length];
        }
        q.push(pick);
    }
    return q;
}
function fallSeconds(stage, slow) {
    const base = Math.max(1.55, 5 - (Math.min(stage, 12) - 1) * 0.32);
    return slow ? base + 2.4 : base;
}

        ? session.picked.map((s) => `<button type="button" class="chip" data-sym="${esc(s)}">${esc(s)} ×</button>`).join("")
        : `<span class="dish-empty">培養皿</span>`;
    $("submit").disabled = session.picked.length === 0;
}
let tileDrag = null;
function onTileDown(e) {
    const tile = e.target.closest(".tile");
    if (!tile || !session || session.lock) return;
    e.preventDefault();
    tileDrag = { sym: tile.dataset.sym, x: e.clientX, y: e.clientY, moved: false, id: e.pointerId, tile };
    tile.setPointerCapture(e.pointerId);
    tile.addEventListener("pointermove", onTileMove);
    tile.addEventListener("pointerup", onTileUp);
    tile.addEventListener("pointercancel", onTileUp);
}
function onTileMove(e) {
    if (!tileDrag || e.pointerId !== tileDrag.id) return;
    if (Math.hypot(e.clientX - tileDrag.x, e.clientY - tileDrag.y) > 8) {
        tileDrag.moved = true;
        const g = $("ghost");
        g.hidden = false;
        g.textContent = tileDrag.sym;
        g.style.left = e.clientX + "px";
        g.style.top = e.clientY + "px";
    }
}
function onTileUp(e) {
    if (!tileDrag || e.pointerId !== tileDrag.id) return;
    const drag = tileDrag;
    tileDrag = null;
    $("ghost").hidden = true;
    drag.tile.removeEventListener("pointermove", onTileMove);
    drag.tile.removeEventListener("pointerup", onTileUp);
    drag.tile.removeEventListener("pointercancel", onTileUp);
    if (!session || session.lock) return;
    if (!drag.moved) {
        togglePicked(drag.sym);
        return;
    }
    const dish = $("dish").getBoundingClientRect();
    const inside = e.clientX >= dish.left && e.clientX <= dish.right && e.clientY >= dish.top && e.clientY <= dish.bottom;
    if (inside && !session.picked.includes(drag.sym)) session.picked.push(drag.sym);
    paintSelection();
}
function togglePicked(sym) {
    if (!session || session.lock) return;
    if (session.picked.includes(sym)) session.picked = session.picked.filter((s) => s !== sym);
    else session.picked.push(sym);
    paintSelection();
}
function updateMixHud() {
    if (!session) return;
    $("g-left").textContent = session.level.title;
    $("g-mid").textContent = Math.max(0, Math.ceil(session.left)) + " 秒";
    const bar = $("timefill");
    if (bar) {
        const frac = Math.max(0, session.left / session.totalTime);
        bar.style.width = (frac * 100) + "%";
        bar.style.background = frac < 0.3 ? "#ef4444" : "#0f6e86";
    }
    $("hint-btn").textContent = `提示 (${session.hints})`;
    $("hint-btn").disabled = session.hints <= 0;
}
function mixTick() {
    if (!session || session.mode !== "mix" || session.over) return;
    const now = Date.now();
    const dt = (now - session.lastTick) / 1000;
    session.lastTick = now;
    if (session.paused || session.lock) return;
    session.left -= dt;
    updateMixHud();
    if (session.left <= 0) failRecipe();
}
function submitMix() {
    if (!session || session.lock || session.over) return;
    const need = session.recipe.elements;
    const missing = need.filter((s) => !session.picked.includes(s));
    const extra = session.picked.filter((s) => !need.includes(s));
    if (!missing.length && !extra.length) { successRecipe(); return; }
    session.tries++;
    session.clean = false;
    profile().streak = 0;
    saveAll();
    sBad();
    shakeApp();
    if (session.tries >= 2 && !session.level.showFormula) setFeedback("化學式是 " + session.recipe.formula + "。元素要完全符合。");
    else setFeedback("還不是這個組合。不多也不少，才算完成。");
}
function mixHint() {
    if (!session || session.lock || session.hints <= 0) return;
    const missing = session.recipe.elements.filter((s) => !session.picked.includes(s));
    if (!missing.length) { setFeedback("需要的元素都放進去了。檢查有沒有多放。"); return; }
    session.hints--;
    session.hinted = true;
    session.clean = false;
    session.picked.push(missing[0]);
    setFeedback("提示：放入 " + missing[0]);
    paintSelection();
    updateMixHud();
}
function successRecipe() {
    session.lock = true;
    const recipe = session.recipe;
    const first = session.tries === 0 && !session.hinted;
    const gain = first ? 25 : 12;
    if (!session.hinted) {
        const notices = [];
        recipe.elements.forEach((sym) => notices.push(...remember(elementBySym(sym).z, true)));
        session.score += gain;
        const rank = addScore(gain);
        surface(notices, rank);
    } else {
        session.score += gain;
        addScore(gain);
    }
    session.correct++;
    setFeedback("配好了！" + recipe.tip);
    sOk();
    later(nextRecipe, 1300);
}
function failRecipe() {
    if (!session || session.lock || session.over) return;
    session.lock = true;
    session.clean = false;
    const recipe = session.recipe;
    const notices = [];
    recipe.elements.forEach((sym) => {
        if (!session.picked.includes(sym)) notices.push(...remember(elementBySym(sym).z, false));
    });
    if (notices.length === 0) {
        profile().streak = 0;
        saveAll();
    } else surface(notices, null);
    saveAll();
    session.wrongs.push({ name: recipe.name, formula: recipe.formula, sym: recipe.elements.join("、"), zh: recipe.name, picked: null });
    setFeedback(`${recipe.name} ${recipe.formula} 需要 ${recipe.elements.join("、")}。${recipe.tip}`);
    sBad();
    later(nextRecipe, 1800);
}
function nextRecipe() {
    if (!session || session.mode !== "mix") return;
    session.index++;
    if (session.index >= session.level.recipes.length) finishMix();
    else loadRecipe();
}
function finishMix() {
    if (!session || session.over) return;
    session.over = true;
    const level = session.level;
    const total = level.recipes.length;
    const correct = session.correct;
    let score = session.score;
    const all = correct === total;
    if (all) {
        score += 50;
        if (level.id > profile().mixCleared) profile().mixCleared = level.id;
        const rank = addScore(50);
        if (rank) session.notices.push("晉升為" + rank.name + "！");
    }
    sWinBurst(all);
    endGame({
        mode: "mix",
        win: all,
        stars: correct === total ? (session.clean ? 3 : 2) : correct ? 1 : 0,
        title: `配製完成 ${correct}/${total}`,
        score,
        detail: all ? "這組訂單都配對了。" : "未完成的訂單列在下面，可以再練一次。",
        wrongs: session.wrongs.slice(),
        notices: [...new Set(session.notices)],
        againLabel: all && level.id < 3 ? "下一關" : "再練本關",
        again: () => startMix(all && level.id < 3 ? level.id + 1 : level.id),
        altLabel: "從第 1 關再練",
        alt: () => startMix(1)
    });
}

function endGame(data) {
    closeModal();
    const p = profile();
    if (data.score > (p.best[data.mode] || 0)) {
        p.best[data.mode] = data.score;
        data.best = true;
    }
    screen = "result";
    saveAll();
    stopLoops();
    const v = view();
    v.scrollTop = 0;
    const lines = [];
    const seen = new Set();
    data.wrongs.forEach((w) => {
        const line = w.formula ? `${w.name} ${w.formula} 需要 ${w.sym}` : wrongLine(w);
        if (!seen.has(line)) { seen.add(line); lines.push(line); }
    });
    v.innerHTML = `<div class="wrap">
        <section class="cardbox">
            <p class="stars" aria-label="${data.stars} 星">${starsText(data.stars)}</p>
            <h2>${esc(data.title)}</h2>
            <p class="how">本關 ${data.score} 分${data.best ? " · 新高分" : ""}。累積積分 ${p.earned}。現在是${esc(RANKS.find((r) => r.id === (p.highestRank || "trainee")).name)}。</p>
            <p class="how">${esc(data.detail)}</p>
            ${data.notices.length ? `<p class="how">${data.notices.map(esc).join("<br>")}</p>` : ""}
            ${lines.length ? `<p class="kicker">再記一次</p><p class="how">${lines.map(esc).join("<br>")}</p>` : ""}
        </section>
        <button class="primary" id="again" type="button">${esc(data.againLabel)}</button>
        <button class="ghost" id="alt" type="button">${esc(data.altLabel)}</button>
        <button class="ghost" id="home" type="button">返回實驗室</button>
    </div>`;
    $("again").onclick = data.again;
    $("alt").onclick = data.alt;
    $("home").onclick = showHome;
}

function onKeyDown(e) {
    if (e.key === "Escape") {
        if (session && !session.over) openPause();
        else if (!$("modal").hidden) closeModal();
        return;
    }
    if (!session || session.mode !== "sort" || session.lock || session.paused) return;
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    const cat = $("cat");
    const arena = $("arena");
    if (!cat || !arena) return;
    const w = cat.offsetWidth || 180;
    session.catX += e.key === "ArrowLeft" ? -32 : 32;
    session.catX = Math.max(-w * 0.08, Math.min(arena.clientWidth - w * 0.62, session.catX));
    cat.style.transform = `translateX(${session.catX}px)`;
    e.preventDefault();
}

load();
$("back-btn").onclick = onBack;
$("sound-btn").onclick = () => {
    root.sound = !root.sound;
    saveAll();
    if (root.sound) unlockAudio();
};
$("points-btn").onclick = () => { if (session && !session.over) openPause(); else showShop(); };
$("player-btn").onclick = () => { if (session && !session.over) openPause(); else if (screen === "profiles") showHome(); else showProfiles(); };
document.addEventListener("pointerdown", () => unlockAudio(), { passive: true });
document.addEventListener("visibilitychange", () => {
    if (document.hidden && session && !session.paused && !session.over) openPause();
});
window.addEventListener("resize", () => { if (session && session.mode === "lock") layoutKeys(); });
window.addEventListener("keydown", onKeyDown);
showHome();
    </script>
</body>
</html>
